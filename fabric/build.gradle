plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.19'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://dl.cloudsmith.io/public/tslat/sbl/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.2 ships deobfuscated, so there is no mappings step (matches the
    // official fabric-example-mod 26.2 template) and deps are plain jars.

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "com.geckolib:geckolib-fabric-26.2:${geckolib_version}"
    implementation "net.tslat:smartbrainlib-fabric-26.2:${sbl_version}"

    // :common stays a ModDevGradle project, so `project(":common")` would drag
    // neoforge artifacts onto loom's classpath. Consume its jar as a file
    // instead — both sides use official mojmap names, so it needs no remap.
    // (`project.project(...)` because inside dependencies{} bare `project(...)`
    // resolves to a ProjectDependency.)
    implementation files(project.project(':common').tasks.named('jar', Jar).flatMap { it.archiveFile })
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/projectnublar.accesswidener")
    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            programArgs '--nogui'
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    var replaceProperties = [
            version                : version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_author             : mod_author,
            mod_license            : mod_license,
            minecraft_version     : minecraft_version,
            minecraft_version_range: minecraft_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
