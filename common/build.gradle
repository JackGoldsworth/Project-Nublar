plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// Mojang ships Java 25 to end users in 26.2, so mods target 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
}

repositories {
    mavenCentral()
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://dl.cloudsmith.io/public/tslat/sbl/maven/' }
}

dependencies {
    implementation "com.geckolib:geckolib-common-26.2:${geckolib_version}"
    implementation "net.tslat:smartbrainlib-common-26.2:${sbl_version}"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

base {
    archivesName = "${mod_id}-common-${minecraft_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
